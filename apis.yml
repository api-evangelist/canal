aid: canal
name: Canal
description: >-
  Canal (now Rokt Catalog, following Rokt's acquisition of Canal) is a dropship
  and marketplace commerce platform that lets brands, retailers, and platforms
  sell curated third-party products without holding inventory. Suppliers (Brands)
  list products into Canal's vetted network; Storefronts (Partners) surface those
  products, and Canal forwards each order to the Supplier who ships directly to
  the customer. The Rokt Catalog Platform API (api.shopcanal.com/platform) exposes
  products, variants, orders, fulfillments, refunds, returns, shops, shipping/tax
  calculation, and webhooks so custom, headless, and marketplace backends can
  integrate alongside the native Shopify, WooCommerce, and BigCommerce apps. Canal
  was an a16z portfolio company.
