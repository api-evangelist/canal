components:
  schemas:
    Address:
      type: object
      properties:
        name:
          type: string
        address1:
          type: string
        address2:
          type: string
        city:
          type: string
        province:
          type: string
        province_code:
          type: string
        country:
          type: string
        country_code:
          type: string
        zip:
          type: string
        phone:
          type: string
      required:
      - address1
      - city
      - country
      - name
      - province
      - zip
    BulkCreateSupplierPartnership:
      type: object
      properties:
        canal_contact_emails:
          type: array
          items:
            type: string
            format: email
      required:
      - canal_contact_emails
    ConfirmationDetails:
      type: object
      properties:
        confirmation_number:
          type: string
        catalog_order_id:
          type: string
        order_id:
          type: string
        order_date:
          type: string
          format: date-time
        order_status:
          type: string
        fulfillment_status:
          type: string
        tracking_info:
          type: array
          items:
            type: string
      required:
      - confirmation_number
      - order_date
      - order_id
    CreateFulfillment:
      type: object
      properties:
        name:
          type: string
        service:
          type: string
        shipment_status:
          $ref: '#/components/schemas/ShipmentStatusEnum'
        status:
          $ref: '#/components/schemas/Status406Enum'
        tracking_company:
          type: string
          nullable: true
        tracking_numbers:
          type: array
          items:
            type: string
          nullable: true
        tracking_urls:
          type: array
          items:
            type: string
          nullable: true
        order_id:
          type: string
          format: uuid
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/LineItem'
      required:
      - line_items
      - name
      - order_id
      - service
      - shipment_status
      - status
    CreateOrderLineItem:
      type: object
      properties:
        variant_id:
          type: string
          format: uuid
        quantity:
          type: integer
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
      required:
      - quantity
      - variant_id
    CreateReturnLineItem:
      type: object
      properties:
        line_item_id:
          type: string
          format: uuid
        quantity:
          type: integer
        customer_note:
          type: string
          nullable: true
        return_reason:
          $ref: '#/components/schemas/ReturnReasonEnum'
      required:
      - line_item_id
      - quantity
      - return_reason
    CreateUpdateWebhook:
      type: object
      properties:
        topic:
          type: string
        address:
          type: string
      required:
      - address
      - topic
    CreateVariant:
      type: object
      properties:
        title:
          type: string
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          description: The price of the variant to be sold at.
        compare_at_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          description: The original price of the product from before the sale price.
            Should be greater than "price". If you elect to not allow sale price passthrough,
            Connected Storefronts will sell items at this price.
        inventory_policy:
          $ref: '#/components/schemas/InventoryPolicyEnum'
        inventory_quantity:
          type: integer
        option1:
          type: string
        option2:
          type: string
        option3:
          type: string
        sku:
          type: string
        position:
          type: integer
        image_src:
          type: string
        weight:
          type: number
          format: double
        weight_unit:
          type: string
        product_id:
          type: string
          format: uuid
      required:
      - inventory_policy
      - inventory_quantity
      - option1
      - price
      - product_id
    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          nullable: true
          title: Email address
          maxLength: 403
        first_name:
          type: string
          nullable: true
          maxLength: 255
        last_name:
          type: string
          nullable: true
          maxLength: 256
        orders_count:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
      required:
      - id
    Error:
      type: object
      properties:
        message:
          type: string
        detail: {}
    ExternalProduct:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        shop:
          allOf:
          - $ref: '#/components/schemas/Shop'
          readOnly: true
        variants:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
          readOnly: true
        body_html:
          type: string
          nullable: true
          maxLength: 60000
        handle:
          type: string
          nullable: true
          maxLength: 258
        image_src:
          type: string
          nullable: true
          maxLength: 1043
        images:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        options:
          type: array
          items:
            type: object
